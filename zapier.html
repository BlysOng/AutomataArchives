<!-- ============================================================
     EDIT POINT: add a real Zapier project by adding one object to
     the ZAPIER_WORKFLOWS array in the inline <script> below — the
     search box, filter chips, list/grid views, modal and pagination
     all render themselves from that data (see initWorkflowBrowser()
     in script.js), exactly like the n8n page. Drop the matching
     .json export into /zapier/ and point "file" at it.
     ============================================================ -->
<main>
  <section class="platform">
    <div class="wrap">
      <div class="wf-controls frame">
        <div class="wf-controls__top">
          <input type="text" id="wfSearch" class="wf-search"
                 placeholder="Search integrations… (e.g. Lead Generation, CRM, Email)" autocomplete="off">
          <div class="view-toggle" id="wfViewToggle" role="group" aria-label="View style">
            <button type="button" class="view-toggle__btn is-active" data-view="list" aria-pressed="true">☰ List</button>
            <button type="button" class="view-toggle__btn" data-view="grid" aria-pressed="false">▦ Grid</button>
          </div>
        </div>
        <div class="filter-chips" id="wfChips"></div>
      </div>

      <div id="zapierGrid" class="wf-list"></div>
    </div>
  </section>
</main>

<footer class="footer wrap">
  <span>© 2026 AUTOMATA ARCHIVE — BUILT BY HAND, RUN BY MACHINE</span>
  <span>SIGNAL STATUS: ONLINE</span>
</footer>

<script src="script.js"></script>
<script>
  // EDIT POINT: same shape and same rules as N8N_WORKFLOWS on the
  // n8n page — see the long comment there for what each field does,
  // the optional "image" screenshot field, and the security note on
  // scrubbing real Zap exports before adding them here. Empty for
  // now since no Zaps are on file yet; the page shows "No workflows
  // here yet" until this array has entries.
  const ZAPIER_WORKFLOWS = [
    // {
    //   title: 'Example Zap Title',
    //   status: 'LIVE',
    //   description: 'One or two sentences on what it does end to end.',
    //   stages: ['Trigger App', 'Filter/Format', 'Action App'],
    //   tags: ['Lead Generation'],
    //   image: 'zapier/screenshots/example-zap.png',
    //   file: 'zapier/example-zap.json',
    //   downloadName: 'Example-Zap.json'
    // }
  ];

  initWorkflowBrowser({
    containerSelector: '#zapierGrid',
    searchSelector: '#wfSearch',
    chipsSelector: '#wfChips',
    viewToggleSelector: '#wfViewToggle',
    data: ZAPIER_WORKFLOWS
  });
</script>

</body>
</html>
